<!doctype html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avatar Studio</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1d212c;--line:#2a3040;--text:#e8ebf3;--muted:#8d96ad;--accent:#7c8cff;--accent2:#5560d6;--ok:#3fb97b;--bad:#e5564f;--warn:#e7b34a;--chk:#252a38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Vazirmatn,Tahoma,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent2);border-color:var(--accent);color:#fff}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:#10131a;border:1px solid var(--line);border-radius:5px;padding:3px 6px;min-width:0}
input[type=number]{width:70px}
input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line);background:none;border-radius:4px}
input[type=range]{accent-color:var(--accent)}
#app{display:grid;grid-template-rows:46px 1fr 292px;height:100vh}
#toolbar{display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#toolbar .title{font-weight:700;margin-inline-end:6px}
#projname{width:140px;flex:none}
#toolbar>*{flex:none}
#main{display:grid;grid-template-columns:270px 1fr 310px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0}
#left{border-inline-end:1px solid var(--line)}
#right{border-inline-start:1px solid var(--line)}
.ph{position:sticky;top:0;background:var(--panel);z-index:2;padding:7px 10px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.ph .grow{flex:1}
.pb{padding:8px 10px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row>label{width:92px;color:var(--muted);flex:none}
.row.wrap{flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tabs button{padding:2px 7px;font-size:12px}
.list .item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid #1f2430;cursor:pointer}
.list .item:hover{background:#1c2130}
.list .item.sel{background:#232a44;outline:1px solid var(--accent);outline-offset:-1px}
.list .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item small{color:var(--muted)}
.ib{padding:1px 6px;font-size:12px;min-width:24px}
.thumb{width:36px;height:36px;border:1px solid var(--line);border-radius:4px;background:repeating-conic-gradient(#222836 0 25%,#1a1e29 0 50%) 50%/10px 10px;image-rendering:pixelated;flex:none}
#center{position:relative;background:#0b0d12;min-width:0;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}
#stagehud{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap;background:#0f1117cc;border:1px solid var(--line);padding:4px;border-radius:8px}
#stagehud button,#stagehud select{padding:2px 7px;font-size:12px}
#bottom{border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#bottombody{overflow:auto;flex:1;padding:8px 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid var(--line);border-radius:12px;background:var(--chk);font-size:12px}
.swatch{width:20px;height:20px;border-radius:4px;border:1px solid #0006;display:inline-block;vertical-align:middle}
.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 10px}
.previews figure{margin:0;text-align:center;color:var(--muted);font-size:11px}
.previews canvas{background:repeating-conic-gradient(#222836 0 25%,#1a1e29 0 50%) 50%/10px 10px;border:1px solid var(--line);image-rendering:pixelated;max-width:100%}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:min(1100px,100%);max-height:96vh;overflow:auto;display:flex;flex-direction:column;min-width:min(520px,100%)}
.modal h3{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal h3 .grow{flex:1}
.modal .mb{padding:12px 14px}
.stat{display:flex;gap:8px;margin:2px 0}.stat b{min-width:110px;display:inline-block}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222a40;border:1px solid var(--accent);padding:7px 14px;border-radius:8px;z-index:99;display:none}
#pe{display:grid;grid-template-columns:150px 1fr 190px;gap:8px;min-width:min(960px,92vw)}
#pe .tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
#pe canvas{background:repeating-conic-gradient(#222836 0 25%,#1a1e29 0 50%) 50%/16px 16px;border:1px solid var(--line);image-rendering:pixelated;touch-action:none;max-width:100%}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pal .sw{width:28px;height:28px;border-radius:5px;border:2px solid transparent;cursor:pointer}
.pal .sw.sel{border-color:#fff}
.muted{color:var(--muted)}
@media(max-width:900px){#app{grid-template-rows:46px auto 320px;height:auto;min-height:100vh}#main{grid-template-columns:1fr}#center{height:60vh}#pe{grid-template-columns:1fr}}

</style>
</head>
<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="main">
    <div id="left" class="panel"></div>
    <div id="center"><canvas id="stage"></canvas><div id="stagehud"></div></div>
    <div id="right" class="panel"></div>
  </div>
  <div id="bottom"><div class="tabs" id="bottomtabs"></div><div id="bottombody"></div></div>
</div>
<div id="toast"></div>
<script>
'use strict';
// ===== Avatar Designer — هسته: مدل داده، تاریخچه، ذخیره‌سازی محلی =====
// ابزارِ مستقل و موقت؛ هیچ سروری ندارد. پروژه در IndexedDB/localStorage مرورگر ذخیره می‌شود.

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') e[k] = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const clone = o => JSON.parse(JSON.stringify(o));
function newId(p) { return p + '_' + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3); }
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => (t.style.display = 'none'), ms); }

const CATS = [
  ['body', 'بدن'], ['face', 'صورت'], ['hair', 'مو'], ['eyes', 'چشم'], ['eyebrows', 'ابرو'], ['mouth', 'دهان'], ['hat', 'کلاه'], ['hijab', 'روسری'],
  ['helmet', 'کلاه‌خود'], ['clothes', 'لباس'], ['shirt', 'پیراهن'], ['pants', 'شلوار'], ['shoes', 'کفش'], ['armor', 'زره'], ['sword', 'شمشیر'],
  ['weapon', 'سلاح'], ['shield', 'سپر'], ['accessory', 'اکسسوری'], ['pet', 'حیوان'], ['shadow', 'سایه'], ['effect', 'افکت'],
];
const CAT_FA = Object.fromEntries(CATS);
const MOODS = [['neutral', 'خنثی'], ['happy', 'شاد'], ['sad', 'غمگین'], ['angry', 'عصبانی'], ['surprised', 'متعجب'], ['tired', 'خسته'], ['excited', 'هیجان‌زده']];
const ANCHORS = ['origin', 'center', 'top-center', 'bottom-center', 'left-center', 'right-center'];
const DEFAULT_LAYERS = ['pet', 'body', 'shoes', 'pants', 'shirt', 'clothes', 'armor', 'face', 'eyes', 'eyebrows', 'mouth', 'hair', 'hijab', 'hat', 'helmet', 'accessory', 'sword', 'weapon', 'shield', 'effect'];
const SLOT_CHARS = '0123456789abcdefghijklmnopqrstuvwxyz';

// ---------------------------------------------------------------- ساخت مدل
function newGeometry(x = 48, y = 134) { return { x, y, scale: 1, rotation: 0, opacity: 1, flipX: false, flipY: false }; }
function newPart(name, w = 16, h = 16, dx = 0, dy = 0) {
  return { id: newId('part'), name, w, h, px: new Uint8Array(w * h), dx, dy, scale: 1, rotation: 0, flipX: false, flipY: false, visible: true };
}
function newFamily(name, category, slots) {
  return {
    id: newId('fam'), name, category, characterIds: [], anchor: 'origin', tags: [],
    slots: slots || [{ id: 's1', name: 'اصلی', color: '#cccccc' }, { id: 's2', name: 'سایه', color: '#888888' }, { id: 's3', name: 'خط دور', color: '#222222' }],
    parts: [], variants: [{ id: newId('var'), name: 'Default', colors: {}, overrides: {} }],
    geometry: { '*': newGeometry() },
  };
}
function emptyProject(name = 'Avatar Project') {
  return {
    format: 'rp-avatar-project', version: 1, id: newId('proj'), name, createdAt: Date.now(), updatedAt: Date.now(),
    canvas: { w: 96, h: 144, safe: { x: 8, y: 8, w: 80, h: 128 } },
    characters: [], families: [],
    layers: DEFAULT_LAYERS.map(c => ({ id: 'L_' + c, name: CAT_FA[c] || c, category: c, visible: true, locked: false })),
    moods: {}, backgrounds: [],
    scene: {
      characterId: null, mood: 'neutral', equipped: {}, backgroundId: null,
      bgVisible: true,
      shadow: { on: true, color: '#000000', opacity: 0.35, w: 34, h: 8, x: 48, y: 134 },
      ground: { on: false, color: '#3a4a3a', opacity: 1, height: 16 },
      lighting: { on: false, color: '#ffe9b0', angle: 45, opacity: 0.18 },
      glow: { on: false, color: '#9fb0ff', radius: 60, opacity: 0.25, x: 48, y: 80 },
    },
    view: { zoom: 4, panX: 0, panY: 0, grid: 8, snap: true, showGrid: true, showRuler: true, showSafe: true, showCenter: true, showLayerBoxes: false, guides: [] },
  };
}

// ---------------------------------------------------------------- ابزارهای جستجو
let P = null; // پروژه‌ی جاری
const famById = id => P.families.find(f => f.id === id);
const charById = id => P.characters.find(c => c.id === id);
const layerById = id => P.layers.find(l => l.id === id);
const varOf = (f, vid) => f.variants.find(v => v.id === vid) || f.variants[0];
function compatible(f, charId) { return !f.characterIds.length || !charId || f.characterIds.includes(charId); }
function geomFor(f, charId) {
  const base = f.geometry['*'] || newGeometry();
  const o = charId && f.geometry[charId];
  return Object.assign({}, base, o || {});
}
function slotColor(f, variant, slotId, partId) {
  const ov = partId && variant.overrides && variant.overrides[partId];
  if (ov && ov.colors && ov.colors[slotId]) return ov.colors[slotId];
  return (variant.colors && variant.colors[slotId]) || (f.slots.find(s => s.id === slotId) || {}).color || '#ff00ff';
}

// ---------------------------------------------------------------- (د)سریال‌سازی
function encodeRows(part) {
  const rows = [];
  for (let y = 0; y < part.h; y++) { let s = ''; for (let x = 0; x < part.w; x++) s += SLOT_CHARS[part.px[y * part.w + x]] || '0'; rows.push(s); }
  return rows;
}
function decodeRows(rows, w, h) {
  const px = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px[y * w + x] = Math.max(0, SLOT_CHARS.indexOf((rows[y] || '')[x] || '0'));
  return px;
}
function serialize(p) {
  const c = { ...p, families: p.families.map(f => ({ ...f, parts: f.parts.map(pt => { const { px, ...r } = pt; return { ...r, rows: encodeRows(pt) }; }) })) };
  return JSON.parse(JSON.stringify(c));
}
function deserialize(o) {
  const p = JSON.parse(JSON.stringify(o));
  for (const f of p.families) for (const pt of f.parts) { pt.px = decodeRows(pt.rows || [], pt.w, pt.h); delete pt.rows; }
  const base = emptyProject();
  p.view = Object.assign(base.view, p.view || {});
  p.scene = Object.assign(base.scene, p.scene || {});
  p.canvas = Object.assign(base.canvas, p.canvas || {});
  return p;
}

// ---------------------------------------------------------------- تاریخچه (Undo/Redo)
const H = { undo: [], redo: [], max: 120 };
function snap() { return JSON.stringify(serialize(P)); }
function resetHistory() { H.undo = [snap()]; H.redo = []; }
function commit(msg) {
  P.updatedAt = Date.now();
  const s = snap();
  if (H.undo[H.undo.length - 1] !== s) { H.undo.push(s); if (H.undo.length > H.max) H.undo.shift(); H.redo = []; }
  scheduleSave();
  invalidateCache();
  renderAll();
}
function restore(s) { P = deserialize(JSON.parse(s)); invalidateCache(); scheduleSave(); renderAll(); }
function undo() { if (H.undo.length < 2) return toast('چیزی برای بازگردانی نیست'); H.redo.push(H.undo.pop()); restore(H.undo[H.undo.length - 1]); }
function redo() { if (!H.redo.length) return toast('چیزی برای تکرار نیست'); const s = H.redo.pop(); H.undo.push(s); restore(s); }

// ---------------------------------------------------------------- ذخیره‌سازی محلی (IndexedDB با پشتیبانِ localStorage)
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('avatar-designer', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath: 'id' });
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = 'ls'; }
    return this.db;
  },
  async put(rec) {
    const db = await this.open();
    if (db === 'ls') { localStorage.setItem('ad:' + rec.id, JSON.stringify(rec)); return; }
    await new Promise((res, rej) => { const tx = db.transaction('projects', 'readwrite'); tx.objectStore('projects').put(rec); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
  async get(id) {
    const db = await this.open();
    if (db === 'ls') return JSON.parse(localStorage.getItem('ad:' + id) || 'null');
    return new Promise((res, rej) => { const r = db.transaction('projects').objectStore('projects').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
  },
  async all() {
    const db = await this.open();
    if (db === 'ls') return Object.keys(localStorage).filter(k => k.startsWith('ad:')).map(k => JSON.parse(localStorage.getItem(k)));
    return new Promise((res, rej) => { const r = db.transaction('projects').objectStore('projects').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  },
  async del(id) {
    const db = await this.open();
    if (db === 'ls') { localStorage.removeItem('ad:' + id); return; }
    await new Promise((res, rej) => { const tx = db.transaction('projects', 'readwrite'); tx.objectStore('projects').delete(id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  },
};
let saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
async function saveNow() {
  if (!P) return;
  try { await DB.put({ id: P.id, name: P.name, updatedAt: P.updatedAt, json: snap() }); localStorage.setItem('ad:current', P.id); setStatus('ذخیره شد ✓'); } catch (e) { setStatus('خطا در ذخیره: ' + e.message); }
}
function setStatus(t) { const s = $('#status'); if (s) s.textContent = t; }

'use strict';
// ===== پروژه‌ی نمونه (دموی آماده): ۲ کاراکتر، چندین خانواده‌ی Asset با Variant رنگی، ۷ Mood، ۶ پس‌زمینه =====
// فضای مختصاتِ قطعه‌ها «فضای کاراکتر» است: مبدأ = وسطِ پاهای کاراکتر؛ y منفی = بالا. هندسه‌ی پیش‌فرضِ خانواده (x=48,y=134) آن را روی صحنه می‌گذارد.

function A(w, h) { return { w, h, px: new Uint8Array(w * h) }; }
function sp(a, x, y, s) { if (x >= 0 && y >= 0 && x < a.w && y < a.h) a.px[y * a.w + x] = s; }
function rf(a, x, y, w, h, s) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) sp(a, x + i, y + j, s); }
/** جعبه با خط دور (slot اول=outline)، پرکننده، سایه‌ی راست/پایین؛ round = گوشه‌های گرد */
function sbox(w, h, fill, shade, outline, round) {
  const a = A(w, h);
  rf(a, 0, 0, w, h, outline);
  rf(a, 1, 1, w - 2, h - 2, fill);
  if (shade) { rf(a, w - 3, 1, 2, h - 2, shade); rf(a, 1, h - 3, w - 2, 2, shade); }
  if (round) for (const [x, y] of [[0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]]) sp(a, x, y, 0);
  return a;
}
function addPart(f, name, a, dx, dy) { const p = newPart(name, a.w, a.h, dx, dy); p.px = a.px; f.parts.push(p); return p; }
function dk(hex, k) { const [r, g, b] = hexToRgb(hex); const m = c => clamp(Math.round(c * k), 0, 255); return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }
function lt(hex, k) { const [r, g, b] = hexToRgb(hex); const m = c => clamp(Math.round(c + (255 - c) * k), 0, 255); return '#' + [m(r), m(g), m(b)].map(v => v.toString(16).padStart(2, '0')).join(''); }
function slots(...defs) { return defs.map(([name, color], i) => ({ id: 's' + (i + 1), name, color })); }
function setVariants(f, list) {
  f.variants = list.map(([name, cols]) => ({ id: newId('var'), name, colors: Object.fromEntries(Object.entries(cols).map(([k, v]) => [k, v])), overrides: {} }));
}

function seedProject() {
  const p = emptyProject('Demo — Avatar Studio');
  P = p; // ابزارهای newFamily به P نیاز ندارند؛ فقط برای سازگاری
  const hero = { id: newId('char'), name: 'Character 01 — Hero', notes: '' };
  const heroine = { id: newId('char'), name: 'Character 02 — Heroine', notes: '' };
  p.characters.push(hero, heroine);
  const fams = p.families;
  const mk = (name, cat, sl, charIds = []) => { const f = newFamily(name, cat, sl); f.characterIds = charIds; fams.push(f); return f; };

  // ---- بدن
  const skinSlots = slots(['skin', '#e9b48f'], ['shade', '#c98c68'], ['outline', '#3a2a24']);
  const skins = [['Light', { s1: '#f0c4a0', s2: '#d49a78', s3: '#3a2a24' }], ['Tan', { s1: '#d9a070', s2: '#b97f52', s3: '#3a2a24' }], ['Brown', { s1: '#a8683f', s2: '#85492a', s3: '#2e1d16' }], ['Dark', { s1: '#6e432b', s2: '#52301d', s3: '#22140e' }]];
  const body = (name, charId, headW) => {
    const f = mk(name, 'body', skinSlots.map(s => ({ ...s })), [charId]);
    addPart(f, 'legL', sbox(9, 30, 1 + 0, 0, 3), -10, -30);
    f.parts[0].px = (() => { const a = sbox(9, 30, 1, 2, 3); return a.px; })();
    addPart(f, 'legR', sbox(9, 30, 1, 2, 3), 1, -30);
    addPart(f, 'torso', sbox(26, 30, 1, 2, 3), -13, -60);
    addPart(f, 'armL', sbox(7, 28, 1, 2, 3, true), -20, -59);
    addPart(f, 'armR', sbox(7, 28, 1, 2, 3, true), 13, -59);
    addPart(f, 'neck', sbox(6, 4, 1, 2, 3), -3, -64);
    const head = sbox(headW, 22, 1, 2, 3, true);
    rf(head, 0, 9, 1, 5, 3); // گوش‌ها
    addPart(f, 'head', head, -Math.floor(headW / 2), -86);
    setVariants(f, skins);
    return f;
  };
  const bodyHero = body('Body — Hero', hero.id, 22);
  const bodyHeroine = body('Body — Heroine', heroine.id, 22);

  // ---- چشم / ابرو

'use strict';
// ===== رندر: اسپرایتِ خانواده/واریانت، صحنه، پس‌زمینه و پیش‌نمایش‌ها =====

const spriteCache = new Map();
const imgCache = new Map();
function invalidateCache() { spriteCache.clear(); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function hexToRgb(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return [255, 0, 255]; const n = parseInt(m[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function partCanvas(f, variant, part) {
  const c = mkCanvas(part.w, part.h);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(part.w, part.h);
  const cols = {};
  for (let i = 0; i < part.px.length; i++) {
    const s = part.px[i];
    if (!s) continue;
    const sl = f.slots[s - 1];
    if (!sl) continue;
    const col = cols[sl.id] || (cols[sl.id] = hexToRgb(slotColor(f, variant, sl.id, part.id)));
    img.data[i * 4] = col[0]; img.data[i * 4 + 1] = col[1]; img.data[i * 4 + 2] = col[2]; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
function partCorners(pt) {
  const cx = pt.dx + pt.w / 2, cy = pt.dy + pt.h / 2, a = (pt.rotation * Math.PI) / 180, sx = pt.scale * (pt.flipX ? -1 : 1), sy = pt.scale * (pt.flipY ? -1 : 1);
  return [[-pt.w / 2, -pt.h / 2], [pt.w / 2, -pt.h / 2], [pt.w / 2, pt.h / 2], [-pt.w / 2, pt.h / 2]].map(([x, y]) => {
    const X = x * sx, Y = y * sy;
    return [cx + X * Math.cos(a) - Y * Math.sin(a), cy + X * Math.sin(a) + Y * Math.cos(a)];
  });
}
/** اسپرایتِ ترکیبیِ یک خانواده در یک واریانت: {canvas, ox, oy} (ox/oy نسبت به مبدأِ خانواده) */
function familySprite(f, variant) {
  const key = f.id + '|' + variant.id;
  let s = spriteCache.get(key);
  if (s) return s;
  const parts = f.parts.filter(p => p.visible && !(variant.overrides[p.id] && variant.overrides[p.id].visible === false));
  if (!parts.length) { s = { canvas: mkCanvas(1, 1), ox: 0, oy: 0, w: 0, h: 0, empty: true }; spriteCache.set(key, s); return s; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of parts) for (const [x, y] of partCorners(p)) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  x0 = Math.floor(x0); y0 = Math.floor(y0); x1 = Math.ceil(x1); y1 = Math.ceil(y1);
  const c = mkCanvas(x1 - x0, y1 - y0);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  for (const p of parts) {
    ctx.save();
    ctx.translate(p.dx + p.w / 2 - x0, p.dy + p.h / 2 - y0);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.scale(p.scale * (p.flipX ? -1 : 1), p.scale * (p.flipY ? -1 : 1));
    ctx.drawImage(partCanvas(f, variant, p), -p.w / 2, -p.h / 2);
    ctx.restore();
  }

}
function anchorPoint(f, s) {
  switch (f.anchor) {
    case 'center': return [s.ox + s.w / 2, s.oy + s.h / 2];
    case 'top-center': return [s.ox + s.w / 2, s.oy];
    case 'bottom-center': return [s.ox + s.w / 2, s.oy + s.h];
    case 'left-center': return [s.ox, s.oy + s.h / 2];
    case 'right-center': return [s.ox + s.w, s.oy + s.h / 2];
    default: return [0, 0];
  }
}

/** فهرستِ آیتم‌های قابل‌رسم صحنه (پایین → بالا) */
function sceneItems() {
  const out = [];
  const charId = P.scene.characterId;
  for (const L of P.layers) {
    if (!L.visible) continue;
    const eq = P.scene.equipped[L.id];
    if (!eq) continue;
    let fam = famById(eq.familyId), vid = eq.variantId;
    if (L.category === 'mouth' && P.moods[P.scene.mood] && famById(P.moods[P.scene.mood].familyId)) { fam = famById(P.moods[P.scene.mood].familyId); vid = P.moods[P.scene.mood].variantId; }
    if (!fam || !compatible(fam, charId)) continue;
    const variant = varOf(fam, vid);
    const spr = familySprite(fam, variant);
    if (spr.empty) continue;
    out.push({ layer: L, fam, variant, spr, g: geomFor(fam, charId) });
  }
  return out;
}
function drawItem(ctx, it, extraAlpha = 1) {
  const { fam, spr, g } = it;

  ctx.save();
  ctx.globalAlpha = clamp(g.opacity, 0, 1) * extraAlpha;
  ctx.translate(g.x, g.y);
  ctx.rotate((g.rotation * Math.PI) / 180);
  ctx.scale(g.scale * (g.flipX ? -1 : 1), g.scale * (g.flipY ? -1 : 1));
  ctx.translate(-ax, -ay);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr.canvas, spr.ox, spr.oy);
  ctx.restore();
}
function itemMatrix(it) {
  // نگاشتِ نقطه‌ی محلیِ اسپرایت (بدون ox/oy) به مختصاتِ صحنه

  const g = it.g, a = (g.rotation * Math.PI) / 180, sx = g.scale * (g.flipX ? -1 : 1), sy = g.scale * (g.flipY ? -1 : 1);
  return (lx, ly) => { const X = (lx - ax) * sx, Y = (ly - ay) * sy; return [g.x + X * Math.cos(a) - Y * Math.sin(a), g.y + X * Math.sin(a) + Y * Math.cos(a)]; };
}
function itemQuad(it) {
  const m = itemMatrix(it), s = it.spr;

  L.push('## Mood Mapping', '', ...MOODS.map(([m]) => { const x = a.moods[m]; const fam = x && a.assetFamilies.find(f => f.id === x.familyId); const v = x && a.variants.find(y => y.id === x.variantId); return `- \`${m}\` → ${fam ? fam.name + (v ? ' / ' + v.name : '') : '(none)'}`; }), '');
  L.push('## Backgrounds', '', ...a.backgrounds.map(b => `- **${b.name}** — ${b.type}, ${b.color}${b.type === 'gradient' ? ' → ' + b.color2 : ''}, pattern ${(b.pattern || {}).kind || 'none'}, effects ${JSON.stringify(b.effects || {})}`), '');

function buildClaudeMd(sys) {
  const a = sys.avatarSystem, c = counts(sys);
  return `# CLAUDE_AVATAR_IMPLEMENTATION

> Instructions for the engineer/agent that implements this avatar system inside the Routine Planner (Flutter) app. Source data: \`avatar-system.json\` (this bundle). Visual reference: \`sprites/\` and \`previews/\`.

## 1. What to build
A layered, pixel-art avatar renderer driven entirely by \`avatar-system.json\`:
- ${c.Characters} character(s), ${c['Asset Families']} asset families, ${c.Variants} variants, ${c.Layers} layers, ${c.Moods} moods, ${c.Backgrounds} backgrounds.
- The existing avatar/wardrobe/coins/ownership data in the app's state must keep working (map old item ids to new families where equivalent; never delete user data).

## 2. Where assets go
- Copy \`avatar-system.json\` to \`flutter_app/assets/avatar/avatar-system.json\` and declare it (and \`assets/avatar/sprites/\`) in \`pubspec.yaml\`.
- Either (a) render from \`parts[].rows\` + variant colors at runtime (preferred: recolor-able, tiny), or (b) use the pre-rendered \`sprites/<familyId>/<variantId>.png\` with \`spriteOffset\`.
- Use \`FilterQuality.none\` / nearest-neighbour everywhere; never anti-alias pixel art.

## 3. Components to implement
1. \`AvatarSystem\` model + loader (parse JSON once, cache).
2. \`AvatarComposer\` (CustomPainter or pre-composited \`ui.Image\`): input = characterId, equipped map (layerId → {familyId, variantId}), mood, background id, scene options; output = canvas ${a.canvas.w}×${a.canvas.h} scaled by an integer factor.
3. \`AvatarView\` widget with sizes: full, inventory, profile (circle crop of head), small icon, modal — see \`previews/\` for framing.
4. Wardrobe UI reads categories/families/variants from the JSON (no hard-coded lists).

## 4. Layer order (bottom → top)
${a.layers.map(l => `${l.order + 1}. ${l.id} (${l.category})`).join('\n')}

Draw strictly in this order. Hidden layers are skipped.

## 5. Geometry
- Effective geometry of a family = \`geometry[familyId].base\` overridden by \`characterOverrides[characterId]\` (per-field).
- Transform: translate(x,y) → rotate(rotation°) → scale(scale·flip) → translate(−anchor) → draw sprite at spriteOffset. Coordinates are canvas pixels (${a.canvas.w}×${a.canvas.h}); origin of characters = feet center.
- **All variants of a family share the same geometry** — never store position per variant.

## 6. Variants
Colors per variant: \`variants[].colors[slotId]\`; optional per-part \`overrides[partId] = {visible?, colors?}\`. Pixel slot n ↔ \`slots[n-1]\`.

## 7. Moods
\`moods[mood] = {familyId, variantId}\` → replaces the drawn asset of the layer with category \`mouth\` only. Moods: ${MOODS.map(m => m[0]).join(', ')}. Wire to app events (e.g. completed all habits → happy, missed → sad, late night → tired, streak milestone → excited) — keep mapping in one place.

## 8. Shared vs character-specific
- \`characterIds: []\` ⇒ shared by all characters. Otherwise only those characters may equip it (hide others in the wardrobe; ignore if equipped).
- Character-specific geometry overrides live in \`geometry[familyId].characterOverrides\`.

## 9. Background & scene
\`backgrounds[]\` (solid/gradient/image + pattern + vignette/scanlines/noise) and \`scene.shadow/ground/lighting/glow\`. Draw order: background → glow → ground → shadow → layers → lighting overlay. Day/night themes may pick different background ids.

## 10. Must not change
- User state schema/keys, backups/restore, coins/points/ownership logic, Free/Pro gating, habit data.
- Accessibility labels and RTL layout of existing screens.
- Add migration only; old saved avatars must still render (fall back to default character + default outfit).

## 11. Verification
- Golden-image tests: render each family×variant and compare with \`sprites/\`; render 3 full compositions and compare with \`previews/\`.
- Unit-test geometry resolution (base vs override), layer order, mood→mouth swap, variant recolor, backup round-trip.

## 12. Data summary
${Object.entries(c).map(([k, v]) => `- ${k}: ${v}`).join('\n')}
`;
}

// ---------------------------------------------------------------- ZIP (store) + CRC32
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), chunks = [], cd = []; let off = 0;
  const u16 = n => [n & 255, (n >> 8) & 255], u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(time), ...u16(date), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    chunks.push(lh, name, data);
    cd.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(time), ...u16(date), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), name);
    off += lh.length + name.length + data.length;
  }
  const cdSize = cd.reduce((n, c) => n + c.length, 0);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, 0, 0, 0, 0, ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(off), 0, 0]);
  return new Blob([...chunks, ...cd, end], { type: 'application/zip' });
}
const canvasPng = c => new Promise(r => c.toBlob(async b => r(new Uint8Array(await b.arrayBuffer())), 'image/png'));
async function buildZipFiles() {
  const sys = buildSystem(), files = [];
  files.push({ name: 'avatar-system.json', data: JSON.stringify(sys, null, 2) }, { name: 'AVATAR_SPEC.md', data: buildSpecMd(sys) }, { name: 'CLAUDE_AVATAR_IMPLEMENTATION.md', data: buildClaudeMd(sys) }, { name: 'project.rpa', data: JSON.stringify(serialize(P)) });
  for (const f of P.families) for (const v of f.variants) { const s = familySprite(f, v); if (!s.empty) files.push({ name: `sprites/${f.id}/${v.id}.png`, data: await canvasPng(s.canvas) }); }
  for (const [k, label, w, hh] of PREVIEWS) { const c = mkCanvas(w, hh); renderPreview(k, c, true); files.push({ name: `previews/${k}.png`, data: await canvasPng(c) }); }
  return files;
}
function download(name, blobOrText, type) {

  const a = h('a', { href: URL.createObjectURL(b), download: name }); document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const safeName = () => (P.name || 'avatar').replace(/[^\w\-]+/g, '_');

function openExportPreview() {

      h('div', { class: 'row wrap', style: { marginTop: '10px' } },

        btn('avatar-system.json', () => download('avatar-system.json', JSON.stringify(sys, null, 2), 'application/json')),

  ));

'use strict';

  renderToolbar(); renderLeft(); renderRight(); renderBottom(); renderStage();
}

  const v = P.view, tg = (k, l, t) => h('button', { class: v[k] ? 'on' : '', title: t, onclick: () => { v[k] = !v[k]; scheduleSave(); renderToolbar(); renderStage(); } }, l);
  $('#toolbar').replaceChildren(
    h('span', { class: 'title' }, '🎨 Avatar Studio'),

    btn('Projects', openProjects), btn('New', newProject), btn('Duplicate', dupProject), btn('Reset', resetProject, 'danger'),
    h('span', { class: 'sep' }), btn('↶', undo, '', 'Undo (Ctrl+Z)'), btn('↷', redo, '', 'Redo (Ctrl+Shift+Z)'),

    h('span', { class: 'sep' }),

    h('span', { class: 'sep' }),

  hud.replaceChildren(btn('−', () => zoomAt(ST.cv.clientWidth / 2, ST.cv.clientHeight / 2, 1 / 1.25)), h('span', { id: 'zoomlbl', style: { minWidth: '44px', textAlign: 'center' } }, ''), btn('+', () => zoomAt(ST.cv.clientWidth / 2, ST.cv.clientHeight / 2, 1.25)), btn('Fit', () => { fitView(); renderStage(); }), h('span', { id: 'coords', class: 'muted', style: { minWidth: '90px' } }, ''));
}

// ---- پروژه‌ها
async function loadProject(id) {
  const rec = await DB.get(id); if (!rec) return false;
  P = deserialize(JSON.parse(rec.json)); resetHistory(); invalidateCache(); S.famId = null; S.partId = null; localStorage.setItem('ad:current', id); fitView(); renderAll(); return true;
}
function startProject(p) { P = p; resetHistory(); invalidateCache(); S.famId = null; S.partId = null; S.bgId = null; fitView(); saveNow(); renderAll(); }
function newProject() {
  const demo = confirm('با پروژه‌ی نمونه (دمو) شروع شود؟\nOK = دمو · Cancel = پروژه‌ی خالی');
  if (demo) startProject(seedProject());
  else { const p = emptyProject('Avatar Project'); p.characters.push({ id: newId('char'), name: 'Character 01', notes: '' }); p.scene.characterId = p.characters[0].id; startProject(p); }
}
function dupProject() { const c = deserialize(serialize(P)); c.id = newId('proj'); c.name = P.name + ' (copy)'; c.createdAt = Date.now(); startProject(c); toast('پروژه تکثیر شد'); }

async function openProjects() {
  const all = (await DB.all()).sort((a, b) => b.updatedAt - a.updatedAt);
  const bg = h('div', { class: 'modal-bg', onclick: e => e.target === bg && bg.remove() }, h('div', { class: 'modal' }, h('h3', {}, h('span', { class: 'grow' }, 'پروژه‌ها (ذخیره‌ی محلی مرورگر)'), btn('✕', () => bg.remove())),
    h('div', { class: 'mb list' }, all.map(r => h('div', { class: 'item' + (r.id === P.id ? ' sel' : '') },
      h('span', { class: 'nm' }, r.name, ' ', h('small', {}, new Date(r.updatedAt).toLocaleString())),

function importFile() {

// ---- میان‌برها
document.addEventListener('keydown', e => {
  if (!P || e.target.matches('input,textarea,select') || $('.modal-bg')) return;
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (ctrl && k.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (k === ' ') { S.space = true; e.preventDefault(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); nudge(e.shiftKey ? -8 : -1, 0); }
  else if (k === 'ArrowRight') { e.preventDefault(); nudge(e.shiftKey ? 8 : 1, 0); }
  else if (k === 'ArrowUp') { e.preventDefault(); nudge(0, e.shiftKey ? -8 : -1); }
  else if (k === 'ArrowDown') { e.preventDefault(); nudge(0, e.shiftKey ? 8 : 1); }
  else if (k === 'Delete') { const f = selFam(), L = f && layerOfFam(f.id); if (L) unequip(L.id); }
  else if (k === '+' || k === '=') zoomAt(ST.cv.clientWidth / 2, ST.cv.clientHeight / 2, 1.25);
  else if (k === '-') zoomAt(ST.cv.clientWidth / 2, ST.cv.clientHeight / 2, 1 / 1.25);
});
document.addEventListener('keyup', e => { if (e.key === ' ') S.space = false; });

async function init() {
  initStage();
  let ok = false;
  const cur = localStorage.getItem('ad:current');
  if (cur) { try { ok = await loadProject(cur); } catch (e) { ok = false; } }
  if (!ok) { startProject(seedProject()); }
  window.addEventListener('beforeunload', () => { saveNow(); });
  setStatus('آماده');
}
window.addEventListener('DOMContentLoaded', init);
